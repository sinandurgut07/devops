# main dalının release kapısı.
# Unit ve integration paralel koşar; ikisi de geçince /health smoke kontrolü yapılır.
name: Main CI

on:
  # main'e merge veya doğrudan push.
  push:
    branches: [main]
  # develop'dan main'e açılan pull request.
  pull_request:
    branches: [main]
  # Actions sekmesinden elle çalıştırmak için.
  workflow_dispatch:

# Aynı dalda yeni bir push gelince eski çalıştırmayı iptal eder.
concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow kodu yalnız okur; push veya paket yayınlama yetkisi yok.
permissions:
  contents: read

jobs:
  # İş kuralları. Integration ile aynı anda başlar.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      # Depoyu runner'a alır.
      - uses: actions/checkout@v4

      # Python 3.12 kurar ve pip önbelleğini requirements dosyalarına bağlar.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Uygulama ve test paketlerini pip ile indirir.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # TaskService iş kurallarını çalıştırır (pytest -m unit).
      - name: Run unit tests
        run: pytest -m unit

  # HTTP uçları. Unit job'unu beklemez; ikisi paralel gider.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      # Job'lar ayrı makinede koştuğu için depo yeniden alınır.
      - uses: actions/checkout@v4

      # Python 3.12 kurar ve pip önbelleğini requirements dosyalarına bağlar.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Uygulama ve test paketlerini pip ile indirir.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # HTTP cevaplarını (201, 404, 409, 422) doğrular (pytest -m integration).
      - name: Run integration tests
        run: pytest -m integration

  # Son kapı: testler yeşilken uygulamanın ayağa kalkıp sağlık cevabı verdiğini görür.
  smoke:
    name: Health smoke
    # unit veya integration kırmızıysa smoke çalışmaz.
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      # Depoyu runner'a alır.
      - uses: actions/checkout@v4

      # Python 3.12 kurar ve pip önbelleğini requirements dosyalarına bağlar.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Uygulama ve TestClient paketlerini pip ile indirir.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # create_app() ile uygulamayı açar ve GET /health cevabının {"status":"ok"} olduğunu kontrol eder.
      - name: Check health endpoint
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import create_app

          client = TestClient(create_app())
          response = client.get("/health")
          if response.status_code != 200 or response.json() != {"status": "ok"}:
              raise SystemExit(f"smoke failed: {response.status_code} {response.text}")
          print("smoke ok")
          PY
